<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/cats">🐾 STREETCATS</a>
  </div>
  <ul class="navbar-links">
    <li><a routerLink="/cats" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Avvistamenti</a>
    </li>
    <li><a routerLink="/cats/new" routerLinkActive="active">Nuovo Avvistamento</a></li>
    <ng-container *ngIf="authService.isLoggedIn(); else notLogged">
      <li class="user-info">
        <span class="logged-in-badge">
          {{ authService.getCurrentUser()?.name || authService.getCurrentUser()?.email || 'Utente' }}
        </span>
        <button class="logout-btn" (click)="logout()">Logout</button>
      </li>
    </ng-container>
    <ng-template #notLogged>
      <li><a routerLink="/auth/login" routerLinkActive="active">Login</a></li>
      <li><a routerLink="/auth/register" routerLinkActive="active">Registrati</a></li>
    </ng-template>
  </ul>
</nav>
