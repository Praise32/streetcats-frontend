<div class="cat-list-container">
  <h2>Tutti gli Avvistamenti di Gatti</h2>

  <div *ngIf="isLoading()" class="loading-indicator">Caricamento avvistamenti...</div>
  <div *ngIf="errorMessage()" class="alert alert-danger">{{ errorMessage() }}</div>

  <app-map [markers]="catMarkers()" [center]="[40.8518, 14.2681]" [zoom]="13"></app-map>

  <h3>Schede degli avvistamenti</h3>
  
  <div *ngIf="cats().length === 0 && !isLoading()" class="no-cats-message">
    Nessun avvistamento trovato.
  </div>

  <div class="cat-cards-list">
    <div *ngFor="let cat of cats()" class="cat-card">
      <img [src]="cat.photos && cat.photos.length > 0 ? cat.photos[0].url : 'assets/placeholder-cat.jpg'"
        alt="Immagine Gatto" 
        class="cat-card-image" 
        (load)="onImageLoad(cat.id)"
        [class.loaded]="isLoaded(cat.id)">

      <div class="cat-card-content">
        <h4>{{ cat.title }}</h4>
        <p>
          <strong>Luogo:</strong> {{ cat.address }}, {{ cat.city }}
        </p>
        <a [routerLink]="['/cats', cat.id]">Dettagli</a>
      </div>
    </div>
  </div>

  <div class="pagination-controls" *ngIf="totalPages() > 1">
     <button (click)="goToPage(currentPage() - 1)" [disabled]="currentPage() === 1">Precedente</button>
    <span>Pagina {{ currentPage() }} di {{ totalPages() }}</span>
    <button (click)="goToPage(currentPage() + 1)" [disabled]="currentPage() === totalPages()">Successiva</button>
  </div>
</div>
